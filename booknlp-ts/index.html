<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookNLP-TS Demo</title>
  <style>
    body {
      font-family: system-ui, Arial;
      padding: 24px;
    }

    .bar {
      width: 100%;
      height: 18px;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-inner {
      height: 100%;
      background: #06f;
      width: 0%;
      transition: width 120ms linear;
    }

    button {
      padding: 8px 12px;
      margin-top: 12px;
    }

    pre {
      background: #111;
      color: #bcd;
      padding: 12px;
      border-radius: 6px;
      max-height: 240px;
      overflow: auto
    }
  </style>
</head>

<body>
  <h1>BookNLP-TS Demo</h1>
  <p>Click <strong>Initialize</strong> to trigger model/vocab downloads routed through the cache service.</p>

  <div class="bar" aria-hidden>
    <div id="progress" class="bar-inner"></div>
  </div>
  <div style="margin-top:8px">Progress: <span id="pct">0%</span></div>

  <div>
    <button id="init">Initialize</button>
    <button id="clear">Clear Cache</button>
  </div>

  <h3>Logs</h3>
  <pre id="log">Logs will appear here.
    </pre>

  <script type="module" src="/src/demo/main.ts"></script>
</body>

</html>
